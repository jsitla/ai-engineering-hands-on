<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova · Northwind Home</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f18; color: #eee; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; } .msg { padding: 12px 16px; border-radius: 12px; margin: 10px 0; line-height: 1.5; }
  .you { background: #2a2a40; } .nova { background: #1d2f27; }
  form { display: flex; gap: 8px; } input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #1a1a26; color: #eee; font-size: 16px; }
  button { padding: 12px 18px; border-radius: 10px; border: 0; background: #9b6bff; color: white; font-size: 16px; }
</style>
</head>
<body>
<h1>Nova · Northwind Home help</h1>
<div id="chat"></div>
<form id="f"><input id="q" placeholder="Ask about delivery, returns, payment..." autocomplete="off"><button>Ask</button></form>
<script>
const chat = document.getElementById("chat");
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById("q"); const text = q.value.trim(); if (!text) return; q.value = "";
  chat.insertAdjacentHTML("beforeend", `<div class="msg you"></div>`); chat.lastChild.textContent = text;
  chat.insertAdjacentHTML("beforeend", `<div class="msg nova"></div>`); const box = chat.lastChild;
  const r = await fetch("/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
  const reader = r.body.getReader(); const dec = new TextDecoder();
  while (true) { const {done, value} = await reader.read(); if (done) break; box.textContent += dec.decode(value, {stream: true}); }
};
const preset = new URLSearchParams(location.search).get("q");   // ?q=... asks right away (used for screenshots)
if (preset) { document.getElementById("q").value = preset; document.getElementById("f").requestSubmit(); }
</script>
</body>
</html>
